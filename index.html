          <input type="text" id="f_labels" value="${esc((data.labels||[]).join(', '))}" placeholder="frontend, срочно">
        </label>
      </div>

      <div class="form-divider"></div>
      <div class="form-section">
        <div class="section-title">Трудозатраты</div>
        <div class="grid2">
          <label class="field">Оценка (часы)
            <input type="number" id="f_estimated" min="0" step="0.5" value="${data.estimatedTime||0}" placeholder="0">
          </label>
          <label class="field">Потрачено (часы)
            <input type="number" id="f_spent" min="0" step="0.5" value="${data.spentTime||0}" placeholder="0">
          </label>
        </div>
        <label class="field time-exceed-wrap" id="timeExceedWrap" style="display:${(data.estimatedTime||0)>0&&(data.spentTime||0)>(data.estimatedTime||0)?'flex':'none'}">
          Причина превышения времени <span class="req">*</span>
          <textarea id="f_timeExceed" placeholder="Почему потрачено больше запланированного?">${esc(data.timeExceedReason||'')}</textarea>
        </label>
      </div>

      <label class="field close-reason" id="closeReasonWrap" style="display:${data.status==='closed'?'flex':'none'}">
        Причина закрытия <span class="req">*</span>
        <textarea id="f_close" placeholder="Почему задача закрывается? (обязательно)">${esc(data.closeReason||'')}</textarea>
      </label>`;

  const subtasksHtml=!isNew?`
      <div>
        <div class="sub-h">Подзадачи (${(data.subtasks||[]).filter(s=>s.done).length}/${(data.subtasks||[]).length})</div>
        <div class="subtask-list" id="subtaskList">${(data.subtasks||[]).map(s=>subtaskHtml(s)).join('')}</div>
        <div class="subtask-add">
          <input type="text" id="newSubtask" placeholder="Новая подзадача…">
          <button id="addSubtaskBtn">+</button>
        </div>
      </div>`:'';

  const relatedHtml=!isNew?`
      <div>
        <div class="sub-h">Связанные задачи (${(data.relatedIds||[]).length})</div>
        <div class="rel-list" id="relList">${relatedListHtml(data)}</div>
        <div class="rel-add">
          <input type="text" id="relSearch" placeholder="Выберите или найдите задачу…" autocomplete="off">
          <div class="rel-dropdown" id="relDropdown"></div>
        </div>
      </div>`:'';

  const attachHtml=!isNew?`
      <div>
        <div class="sub-h">Вложения (${(data.attachments||[]).length})</div>
        <div id="attList">${attachmentsHtml(data)}</div>
        <label class="attach-btn"><input type="file" id="attInput" multiple style="display:none"> 📎 Прикрепить файл</label>
        <div class="attach-hint">До 3.5 МБ на файл</div>
      </div>`:'';

  const commentsHtml=!isNew?`
      <div>
        <div class="sub-h">Комментарии (${(data.comments||[]).length})</div>
        <div id="commentList">${(data.comments||[]).map(c=>commentHtml(c)).join('')||'<div style="color:var(--faint);font-size:13px;padding:4px 0">Пока нет комментариев.</div>'}</div>
        <div class="add-comment">
          <textarea id="newComment" placeholder="Комментарий от ${esc(meName())}"></textarea>
          <button class="btn" id="addComment">Отправить</button>
        </div>
      </div>`:'';

  const historyHtml=!isNew?`
      <details class="hist-toggle">
        <summary class="sub-h" style="cursor:pointer;user-select:none">История <span style="font-weight:500;text-transform:none;letter-spacing:0">(${(data.history||[]).length})</span></summary>
        <div style="margin-top:8px">${(data.history||[]).slice().reverse().map(h=>`<div class="hist"><span class="ts mono">${shortTime(h.ts)}</span><span>${esc(h.text)}</span></div>`).join('')}</div>
      </details>`:'';

  const bodyContent=isNew
    ?fieldsHtml
    :`<div class="m-cols">
      <div class="m-col-main">${fieldsHtml}${subtasksHtml}${relatedHtml}${attachHtml}</div>
      <div class="m-col-side">${commentsHtml}${historyHtml}</div>
    </div>`;

  taskModal.innerHTML=`
    <div class="m-head">
      ${isNew?`<strong>${isBug?'🐛 Новый баг':'📋 Новая задача'}</strong>`:`<span class="mono">${typeOf(t.type).icon} ${t.key}</span>`}
      ${!isNew?`<button class="expand-btn" id="expandBtn" aria-label="${modalExpanded?'Компактный режим':'Развернуть'}" title="${modalExpanded?'Компактный режим':'Развернуть'}">${modalExpanded?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>Компактный':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Развернуть'}</button>`:''}
      <button class="x" id="mClose" aria-label="Закрыть">×</button>
    </div>
    <div class="m-body">${bodyContent}</div>
    <div class="m-foot">
      ${!isNew?'<button class="btn ghost danger" id="delTask" aria-label="Удалить задачу">Удалить</button><button class="btn ghost" id="dupeTask" aria-label="Дублировать задачу">Копировать</button>':''}
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="cancelTask">Отмена</button>
      <button class="btn primary" id="saveTask">${isNew?'Создать задачу':'Сохранить'}</button>
    </div>`;

  taskScrim.classList.add('open');
  document.getElementById('mClose').onclick=closeTask;
  document.getElementById('cancelTask').onclick=closeTask;
  document.getElementById('saveTask').onclick=()=>saveTask(isNew);
  const fs=document.getElementById('f_status');
  fs.onchange=()=>{
    const w=document.getElementById('closeReasonWrap');
    w.style.display=fs.value==='closed'?'flex':'none';
    if(fs.value==='closed')setTimeout(()=>document.getElementById('f_close').focus(),0);
  };
  const fEst=document.getElementById('f_estimated'),fSpent=document.getElementById('f_spent');
  const checkTimeExceed=()=>{
    const est=parseFloat(fEst.value)||0,spent=parseFloat(fSpent.value)||0;
    const show=est>0&&spent>est;
    document.getElementById('timeExceedWrap').style.display=show?'flex':'none';
    if(show)setTimeout(()=>document.getElementById('f_timeExceed').focus(),0);
  };
  fEst.oninput=checkTimeExceed;fSpent.oninput=checkTimeExceed;
  if(!isNew){
    document.getElementById('expandBtn').onclick=()=>{
      modalExpanded=!modalExpanded;
      taskModal.className='modal'+(modalExpanded?' expanded':'');
      const btn=document.getElementById('expandBtn');
      btn.innerHTML=modalExpanded
        ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>Компактный'
        :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Развернуть';
    };
    document.getElementById('delTask').onclick=()=>delTask(id);
    document.getElementById('dupeTask').onclick=()=>dupeTask(id);
    document.getElementById('addComment').onclick=()=>addComment(id);
    const attInput=document.getElementById('attInput');
    if(attInput)attInput.onchange=e=>handleAttach(id,e.target.files);
    document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();downloadAtt(b.dataset.dl,b.dataset.name);});
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();removeAtt(id,b.dataset.rm);});
    document.getElementById('addSubtaskBtn').onclick=()=>addSubtask(id);
    document.getElementById('newSubtask').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSubtask(id);}});
    document.querySelectorAll('[data-st-toggle]').forEach(cb=>{cb.onchange=()=>toggleSubtask(id,cb.dataset.stToggle);});
    document.querySelectorAll('[data-st-rm]').forEach(b=>{b.onclick=ev=>{ev.stopPropagation();removeSubtask(id,b.dataset.stRm);};});
    // related tasks
    wireRelatedSearch(id);
    document.querySelectorAll('[data-rel-open]').forEach(b=>{b.onclick=ev=>{ev.stopPropagation();openTask(b.dataset.relOpen);};});
    document.querySelectorAll('[data-rel-rm]').forEach(b=>{b.onclick=ev=>{ev.stopPropagation();removeRelated(id,b.dataset.relRm);};});
    loadThumbs();
  }
  // bug source — works for both new and existing
  if(isBug){pendingSourceTaskId=null;wireBugSource(id);}
}

function subtaskHtml(s){
  return `<div class="subtask-item">
    <input type="checkbox" ${s.done?'checked':''} data-st-toggle="${s.id}" aria-label="${esc(s.text)}">
    <span class="st-text ${s.done?'done':''}">${esc(s.text)}</span>
    <button class="st-rm" data-st-rm="${s.id}" aria-label="Удалить подзадачу">×</button>
  </div>`;
}
function addSubtask(taskId){
  const inp=document.getElementById('newSubtask');
  const text=inp.value.trim();if(!text)return;
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  t.subtasks=t.subtasks||[];
  t.subtasks.push({id:uid(),text,done:false});
  logHist(t,`Подзадача добавлена: ${text} (${meName()})`);
  persist();openTask(taskId);render();
}
function toggleSubtask(taskId,stId){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const st=(t.subtasks||[]).find(s=>s.id===stId);if(!st)return;
  st.done=!st.done;
  logHist(t,`Подзадача ${st.done?'выполнена':'возвращена'}: ${st.text} (${meName()})`);
  persist();openTask(taskId);render();
}
function removeSubtask(taskId,stId){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  t.subtasks=(t.subtasks||[]).filter(s=>s.id!==stId);
  persist();openTask(taskId);render();
}

function relatedListHtml(data){
  const ids=data.relatedIds||[];
  if(!ids.length)return '<div style="color:var(--faint);font-size:13px;padding:4px 0">Нет связанных задач.</div>';
  return ids.map(rid=>{
    const r=state.tasks.find(x=>x.id===rid);
    if(!r)return '';
    const st=statusOf(r.status);
    return '<div class="rel-item"><span class="rel-key mono" data-rel-open="'+r.id+'">'+r.key+'</span><span class="rel-title" data-rel-open="'+r.id+'">'+esc(r.title)+'</span><span class="rel-st" style="background:'+st.color+'1a;color:'+st.color+'">'+st.name+'</span><button class="rel-rm" data-rel-rm="'+r.id+'" aria-label="Убрать связь">×</button></div>';
  }).join('');
}
function wireRelatedSearch(taskId){
  const inp=document.getElementById('relSearch');
  const dd=document.getElementById('relDropdown');
  if(!inp||!dd)return;
  const t=state.tasks.find(x=>x.id===taskId);
  function showMatches(){
    const q=inp.value.trim().toLowerCase();
    const existing=new Set(t.relatedIds||[]);existing.add(taskId);
    const available=state.tasks.filter(x=>!existing.has(x.id));
    const matches=q?available.filter(x=>x.title.toLowerCase().includes(q)||x.key.toLowerCase().includes(q)):available;
    const shown=matches.slice(0,10);
    if(!shown.length){dd.innerHTML='<div class="rel-empty">'+(q?'Ничего не найдено':'Нет доступных задач')+'</div>';dd.classList.add('open');return;}
    const header='<div class="rel-dd-header">'+(q?'Результаты · '+matches.length:'Доступные задачи · '+available.length)+'</div>';
    dd.innerHTML=header+shown.map(m=>{const st=statusOf(m.status);return '<div class="rel-option" data-rel-add="'+m.id+'"><span class="mono">'+m.key+'</span><span class="rel-opt-title">'+esc(m.title)+'</span><span class="rel-opt-st" style="background:'+st.color+'1a;color:'+st.color+'">'+st.name+'</span></div>';}).join('');
    dd.classList.add('open');
    dd.querySelectorAll('[data-rel-add]').forEach(opt=>{opt.onclick=()=>addRelated(taskId,opt.dataset.relAdd);});
  }
  inp.onfocus=showMatches;
  inp.oninput=showMatches;
  inp.onblur=()=>{setTimeout(()=>dd.classList.remove('open'),150);};
}
let pendingSourceTaskId=null;

function wireBugSource(taskId){
  const inp=document.getElementById('bugSourceSearch');
  const dd=document.getElementById('bugSourceDrop');
  if(!inp||!dd)return;
  const t=taskId?state.tasks.find(x=>x.id===taskId):null;
  const isNewBug=!t;

  function showSrcMatches(){
    const q=inp.value.trim().toLowerCase();
    const available=state.tasks.filter(x=>x.id!==taskId&&x.type!=='bug');
    const matches=q?available.filter(x=>x.title.toLowerCase().includes(q)||x.key.toLowerCase().includes(q)):available;
    const shown=matches.slice(0,10);
    if(!shown.length){dd.innerHTML='<div class="rel-empty">'+(q?'Ничего не найдено':'Нет задач')+'</div>';dd.classList.add('open');return;}
    const header='<div class="rel-dd-header">'+(q?'Результаты · '+matches.length:'Все задачи · '+available.length)+'</div>';
    dd.innerHTML=header+shown.map(m=>{const st=statusOf(m.status);return '<div class="rel-option" data-src-pick="'+m.id+'"><span class="mono">'+m.key+'</span><span class="rel-opt-title">'+esc(m.title)+'</span><span class="rel-opt-st" style="background:'+st.color+'1a;color:'+st.color+'">'+st.name+'</span></div>';}).join('');
    dd.classList.add('open');
    dd.querySelectorAll('[data-src-pick]').forEach(opt=>{opt.onclick=()=>{
      const srcTask=state.tasks.find(x=>x.id===opt.dataset.srcPick);
      if(isNewBug){
        pendingSourceTaskId=opt.dataset.srcPick;
        const disp=document.getElementById('bugSourceDisplay');
        if(disp&&srcTask)disp.innerHTML='<div class="bug-source"><span class="bs-key mono">'+srcTask.key+'</span><span class="bs-title">'+esc(srcTask.title)+'</span><button class="bs-rm" id="bugSourceRm" aria-label="Убрать источник">×</button></div>';
        dd.classList.remove('open');inp.value='';
        const rmBtn2=document.getElementById('bugSourceRm');
        if(rmBtn2)rmBtn2.onclick=ev2=>{ev2.stopPropagation();pendingSourceTaskId=null;document.getElementById('bugSourceDisplay').innerHTML='';};
      }else{
        t.sourceTaskId=opt.dataset.srcPick;
        logHist(t,'Источник бага: '+(srcTask?.key||'')+' ('+meName()+')');
        persist();openTask(taskId);render();
      }
    };});
  }
  inp.onfocus=showSrcMatches;
  inp.oninput=showSrcMatches;
  inp.onblur=()=>{setTimeout(()=>dd.classList.remove('open'),150);};
  const rmBtn=document.getElementById('bugSourceRm');
  if(rmBtn)rmBtn.onclick=ev=>{
    ev.stopPropagation();
    if(isNewBug){pendingSourceTaskId=null;document.getElementById('bugSourceDisplay').innerHTML='';}
    else{t.sourceTaskId=null;persist();openTask(taskId);render();}
  };
}

function addRelated(taskId,relId){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const r=state.tasks.find(x=>x.id===relId);if(!r)return;
  t.relatedIds=t.relatedIds||[];
  r.relatedIds=r.relatedIds||[];
  if(!t.relatedIds.includes(relId))t.relatedIds.push(relId);
  if(!r.relatedIds.includes(taskId))r.relatedIds.push(taskId);
  logHist(t,'Связана с '+r.key+' ('+meName()+')');
  logHist(r,'Связана с '+t.key+' ('+meName()+')');
  persist();openTask(taskId);render();
}
function removeRelated(taskId,relId){
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const r=state.tasks.find(x=>x.id===relId);
  t.relatedIds=(t.relatedIds||[]).filter(x=>x!==relId);
  if(r)r.relatedIds=(r.relatedIds||[]).filter(x=>x!==taskId);
  persist();openTask(taskId);render();
}

function attachmentsHtml(t){
  const a=t.attachments||[];
  if(!a.length)return '<div class="att-empty">Файлов пока нет.</div>';
  return a.map(f=>`
    <div class="att">
      ${f.type&&f.type.indexOf('image/')===0?`<img class="att-thumb" data-thumb="${f.id}" alt="${esc(f.name)}">`:`<span class="att-ico">📄</span>`}
      <div class="att-info"><div class="att-name">${esc(f.name)}</div><div class="att-sub">${formatSize(f.size)}</div></div>
      <button class="att-dl" data-dl="${f.id}" data-name="${esc(f.name)}" title="Скачать" aria-label="Скачать ${esc(f.name)}">⬇</button>
      <button class="att-rm" data-rm="${f.id}" title="Удалить" aria-label="Удалить ${esc(f.name)}">×</button>
    </div>`).join('');
}
async function handleAttach(id,files){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.attachments=t.attachments||[];
  const MAX=3.5*1024*1024;let added=0;
  for(const file of Array.from(files)){
    if(file.size>MAX){toast('«'+file.name+'» больше 3.5 МБ');continue;}
    try{
      const dataUrl=await readFile(file);
      const attId=uid();
      await sset('att:'+attId,dataUrl,true);
      t.attachments.push({id:attId,name:file.name,size:file.size,type:file.type,by:meId(),ts:Date.now()});
      logHist(t,'Файл прикреплён: '+file.name+' ('+meName()+')');added++;
    }catch(e){toast('Не удалось прикрепить файл');}
  }
  if(added){await persist();openTask(id);render();toast(added>1?'Добавлено файлов: '+added:'Файл прикреплён');}
}
async function downloadAtt(attId,name){
  const data=await sget('att:'+attId,true);
  if(!data){toast('Файл недоступен');return;}
  const a=document.createElement('a');a.href=data;a.download=name||'file';document.body.appendChild(a);a.click();a.remove();
}
async function removeAtt(id,attId){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const f=(t.attachments||[]).find(x=>x.id===attId);
  if(!confirm('Удалить файл «'+(f?f.name:'')+'»?'))return;
  t.attachments=(t.attachments||[]).filter(x=>x.id!==attId);
  await sdel('att:'+attId,true);
  logHist(t,'Файл удалён: '+(f?f.name:'')+' ('+meName()+')');
  await persist();openTask(id);render();
}
async function loadThumbs(){
  const imgs=document.querySelectorAll('[data-thumb]');
  for(const im of imgs){try{const d=await sget('att:'+im.dataset.thumb,true);if(d)im.src=d;}catch(e){}}
}
function commentHtml(c){
  return '<div class="comment">'+avatar({id:c.authorId,name:authorName(c.authorId)})+
    '<div class="body"><div class="c-head"><span class="who-n">'+esc(authorName(c.authorId))+'</span><span class="ts">'+shortTime(c.ts)+'</span></div>'+
    '<div class="txt">'+esc(c.text)+'</div></div></div>';
}
function closeTask(){closeScrim(taskScrim);editingId=null;if(_pendingRefresh)refreshFromRemote();}

function saveTask(isNew){
  const title=val('f_title').trim();
  if(!title){toast('Введите название');return;}
  const status=val('f_status');
  const closeEl=document.getElementById('f_close');
  const closeReason=closeEl?closeEl.value.trim():'';
  if(status==='closed'&&!closeReason){
    toast('Укажите причину закрытия');
    const w=document.getElementById('closeReasonWrap');
    if(w){w.style.display='flex';w.classList.remove('flash');void w.offsetWidth;w.classList.add('flash');}
    closeEl&&closeEl.focus();
    return;
  }
  const estimated=parseFloat(val('f_estimated'))||0;
  const spent=parseFloat(val('f_spent'))||0;
  const timeExceedEl=document.getElementById('f_timeExceed');
  const timeExceedReason=timeExceedEl?timeExceedEl.value.trim():'';
  if(estimated>0&&spent>estimated&&!timeExceedReason){
    toast('Укажите причину превышения времени');
    document.getElementById('timeExceedWrap').style.display='flex';
    timeExceedEl&&timeExceedEl.focus();
    return;
  }
  const dueVal=val('f_due');
  if(dueVal&&new Date(dueVal)<new Date(new Date().toDateString())){
    if(!confirm('Срок «'+shortDate(dueVal)+'» уже прошёл. Всё равно сохранить?'))return;
  }
  const labels=val('f_labels').split(',').map(s=>s.trim()).filter(Boolean);
  if(isNew){
    const projId=val('f_project');
    const taskType=val('f_type');
    const t={id:uid(),key:nextKey(taskType),title,description:val('f_desc'),
      type:taskType,status,priority:val('f_prio'),assigneeId:val('f_assignee'),
      projectId:projId,sprintId:val('f_sprint')||null,epicId:val('f_epic')||null,dueDate:val('f_due'),labels,
      sourceTaskId:taskType==='bug'?(pendingSourceTaskId||null):null,
      stepsToReproduce:taskType==='bug'?(document.getElementById('f_steps')?.value.trim()||''):'',
      expectedBehavior:taskType==='bug'?(document.getElementById('f_expected')?.value.trim()||''):'',
      actualBehavior:taskType==='bug'?(document.getElementById('f_actual')?.value.trim()||''):'',
      environment:taskType==='bug'?(document.getElementById('f_env')?.value.trim()||''):'',
      estimatedTime:estimated,spentTime:spent,
      timeExceedReason:estimated>0&&spent>estimated?timeExceedReason:'',
      closeReason:status==='closed'?closeReason:'',
      attachments:[],subtasks:[],relatedIds:[],
      comments:[],history:[{id:uid(),ts:Date.now(),text:'Создано ('+meName()+')'}],
      createdAt:Date.now(),updatedAt:Date.now()};
    if(status==='closed')t.history.push({id:uid(),ts:Date.now(),text:'Причина закрытия: '+closeReason+' ('+meName()+')'});
    state.tasks.unshift(t);toast('Задача создана: '+t.key);
  }else{
    const t=state.tasks.find(x=>x.id===editingId);
    const prevReason=t.closeReason||'';
    const taskType=val('f_type');
    const changes=[];
    const setF=(field,nv,label,fmt)=>{if((t[field]||'')!==(nv||'')){changes.push(label+': '+(fmt?fmt(t[field]):(t[field]||'—'))+' → '+(fmt?fmt(nv):(nv||'—')));t[field]=nv;}};
    setF('type',taskType,'Тип',v=>typeOf(v).name);
    setF('title',title,'Название');
    t.description=val('f_desc');
    setF('status',status,'Статус',v=>statusOf(v)?.name||'—');
    setF('priority',val('f_prio'),'Приоритет',v=>v?v.toUpperCase():'—');
    setF('assigneeId',val('f_assignee'),'Исполнитель',v=>v?(memberOf(v)?.name||'—'):'Не назначен');
    setF('projectId',val('f_project'),'Проект',v=>project(v)?.key||'—');
    setF('sprintId',val('f_sprint')||null,'Спринт',v=>v?(sprint(v)?.name||'—'):'Бэклог');
    setF('epicId',val('f_epic')||null,'Эпик',v=>v?((state.epics||[]).find(e=>e.id===v)?.name||'—'):'Без эпика');
    setF('dueDate',val('f_due'),'Срок',v=>v||'—');
    setF('estimatedTime',estimated,'Оценка',v=>(v||0)+'ч');
    setF('spentTime',spent,'Потрачено',v=>(v||0)+'ч');
    t.timeExceedReason=estimated>0&&spent>estimated?timeExceedReason:'';
    t.stepsToReproduce=taskType==='bug'?(document.getElementById('f_steps')?.value.trim()||''):'';
    t.expectedBehavior=taskType==='bug'?(document.getElementById('f_expected')?.value.trim()||''):'';
    t.actualBehavior=taskType==='bug'?(document.getElementById('f_actual')?.value.trim()||''):'';
    t.environment=taskType==='bug'?(document.getElementById('f_env')?.value.trim()||''):'';
    t.labels=labels;
    t.closeReason=status==='closed'?closeReason:'';
    changes.forEach(c=>logHist(t,c+' ('+meName()+')'));
    if(status==='closed'&&closeReason!==prevReason)logHist(t,'Причина закрытия: '+closeReason+' ('+meName()+')');
    if(!changes.length)t.updatedAt=Date.now();
    if(changes.some(c=>c.startsWith('Исполнитель'))&&t.assigneeId&&t.assigneeId!==meId())
      pushNotification(t.assigneeId,'Вам назначена задача '+t.key+': '+t.title,t.id);
    if(changes.some(c=>c.startsWith('Статус'))&&t.assigneeId&&t.assigneeId!==meId())
      pushNotification(t.assigneeId,'Статус '+t.key+' изменён → '+statusOf(t.status).name,t.id);
    toast('Сохранено');
  }
  persist();closeTask();render();
}
function addComment(id){

function delTask(id){

function dupeTask(id){

function showAuthError(msg){

}
function updateAuthUI(){

function ensureMember(){
  if(!authUser||!state)return;
  const mId='auth:'+authUser.id;
  if(!state.members.find(m=>m.id===mId)){
    state.members.push({id:mId,name:me||authUser.email.split('@')[0]});
    persist();
  }
}

document.getElementById('authSubmit').onclick=async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  if(!email||!pass){showAuthError('Введите email и пароль');return;}
  showAuthError('');
  document.getElementById('authSubmit').disabled=true;
  if(authIsRegister){
    const name=document.getElementById('authName').value.trim();
    const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name:name||email.split('@')[0]}}});
    document.getElementById('authSubmit').disabled=false;
    if(error){showAuthError(error.message);return;}
    if(data.user&&!data.session){
      showAuthError('Проверьте почту — отправлено письмо для подтверждения');return;
    }
    authUser=data.user;
    me=name||email.split('@')[0];
    localStorage.setItem('tracker-me',me);
    ensureMember();
    updateAuthUI();renderWho();closeScrim(userScrim);render();
  }else{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    document.getElementById('authSubmit').disabled=false;
    if(error){showAuthError(error.message);return;}
    authUser=data.user;
    me=localStorage.getItem('tracker-me')||data.user.user_metadata?.name||email.split('@')[0];
    localStorage.setItem('tracker-me',me);
    ensureMember();
    updateAuthUI();renderWho();closeScrim(userScrim);render();
  }
};

document.getElementById('authGoogle').onclick=async()=>{
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});
  if(error)showAuthError(error.message);
};

document.getElementById('authLogout').onclick=async()=>{
  await sb.auth.signOut();
  authUser=null;me=null;
  localStorage.removeItem('tracker-me');
  userScrim.classList.add('auth-bg');
  authIsRegister=false;
  updateAuthUI();renderWho();render();
};

/* ---- Notifications ---- */
async function loadNotifications(){
  if(!authUser)return;
  const mid='auth:'+authUser.id;
  const {data}=await sb.from('notifications').select('*').eq('user_id',mid).order('created_at',{ascending:false}).limit(50);
  notifications=data||[];
  renderNotifBadge();
}
function renderNotifBadge(){
  const unread=notifications.filter(n=>!n.read).length;
  const badge=document.getElementById('notifBadge');
  badge.style.display=unread?'flex':'none';
  badge.textContent=unread>9?'9+':unread;
}
function renderNotifPanel(){
  const list=document.getElementById('notifList');
  if(!notifications.length){list.innerHTML='<div class="np-empty">Нет уведомлений</div>';return;}
  list.innerHTML=notifications.map(n=>{
    const ago=timeAgo(new Date(n.created_at).getTime());
    return '<div class="np-item'+(n.read?'':' unread')+'" data-nid="'+n.id+'"'+(n.task_id?' data-ntask="'+n.task_id+'"':'')+'>'
      +esc(n.text)+'<div class="np-time">'+ago+'</div></div>';
  }).join('');
  list.querySelectorAll('[data-ntask]').forEach(el=>{
    el.onclick=()=>{
      openTask(el.dataset.ntask);
      document.getElementById('notifPanel').classList.remove('open');
      markNotifRead(el.dataset.nid);
    };
  });
}
function timeAgo(ts){
  const d=Date.now()-ts;
  if(d<60000)return 'только что';
  if(d<3600000)return Math.floor(d/60000)+' мин назад';
  if(d<86400000)return Math.floor(d/3600000)+' ч назад';
  return Math.floor(d/86400000)+' дн назад';
}
async function markNotifRead(id){
  const n=notifications.find(x=>x.id===id);
  if(n)n.read=true;
  renderNotifBadge();
  await sb.from('notifications').update({read:true}).eq('id',id);
}
async function markAllRead(){
  if(!authUser)return;
  notifications.forEach(n=>n.read=true);
  renderNotifBadge();renderNotifPanel();
  await sb.from('notifications').update({read:true}).eq('user_id','auth:'+authUser.id).eq('read',false);
}
async function pushNotification(userId,text,taskId){
  if(userId===meId())return;
  const n={id:uid(),user_id:userId,type:'info',text,task_id:taskId||null,read:false};
  await sb.from('notifications').insert(n);
}
document.getElementById('notifBtn').onclick=()=>{
  const panel=document.getElementById('notifPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open'))renderNotifPanel();
};
document.getElementById('notifReadAll').onclick=()=>markAllRead();
document.addEventListener('click',e=>{
  const panel=document.getElementById('notifPanel');
  if(panel.classList.contains('open')&&!e.target.closest('#notifPanel')&&!e.target.closest('#notifBtn'))panel.classList.remove('open');
});

/* ---- UI utils ---- */
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function val(id){return document.getElementById(id).value;}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function avatar(m){if(!m)return '';const id=m.id||m.name;return '<span class="avatar" style="background:'+avColor(id)+'" title="'+esc(m.name)+'">'+initials(m.name)+'</span>';}
function shortDate(d){return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
function sprintRange(s){
  if(s.start&&s.end)return shortDate(s.start)+' – '+shortDate(s.end);
  if(s.start)return 'с '+shortDate(s.start);
  if(s.end)return 'до '+shortDate(s.end);
  return '';
}
function shortTime(ms){const x=new Date(ms);const today=new Date().toDateString()===x.toDateString();
  return today?('сегодня '+x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})):x.toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg);
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show');undoAction=null;},2400);
}
function toastUndo(msg){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+'<button class="undo-btn" id="undoBtn">Отменить</button>';
  t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');undoAction=null;},4500);
  setTimeout(()=>{
    const btn=document.getElementById('undoBtn');
    if(btn)btn.onclick=()=>{
      if(!undoAction)return;
      const task=state.tasks.find(x=>x.id===undoAction.taskId);
      if(task){
        task[undoAction.field]=undoAction.oldVal;
        logHist(task,'Отмена: '+undoAction.desc+' ('+meName()+')');
        persist();render();flashCard(task.id);
      }
      undoAction=null;
      t.classList.remove('show');clearTimeout(toastT);
      toast('Действие отменено');
    };
  },10);
}

  if(!authUser){toast('Войдите в аккаунт');openUser();return;}
  filters.onlyMine=!filters.onlyMine;
  const btn=document.getElementById('onlyMineBtn');
  btn.classList.toggle('active',filters.onlyMine);
  btn.setAttribute('aria-pressed',filters.onlyMine);
  render();
};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
const newDrop=document.getElementById('newDrop');
document.getElementById('newBtn').onclick=e=>{e.stopPropagation();newDrop.classList.toggle('open');};
document.querySelectorAll('[data-new-type]').forEach(b=>b.onclick=()=>{newDrop.classList.remove('open');openTask(null,null,null,b.dataset.newType);});
document.addEventListener('click',()=>newDrop.classList.remove('open'));
document.getElementById('resetBtn').onclick=async()=>{
  if(!confirm('Сбросить все задачи и вернуть демо-данные?'))return;
  state=seed();await persist();buildFilters();render();toast('Демо-данные восстановлены');
};
[taskScrim,userScrim,sprintScrim,settingsScrim].forEach(s=>s.addEventListener('click',e=>{if(e.target===s){if(s===userScrim&&!authUser)return;closeScrim(s);}}));
document.getElementById('sprintName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveSprint();}});

function closeScrim(s){
  if(!s.classList.contains('open'))return;
  s.classList.add('closing');
  setTimeout(()=>{s.classList.remove('open','closing','auth-bg');},190);
}
const scrimOpen=()=>taskScrim.classList.contains('open')||userScrim.classList.contains('open')||sprintScrim.classList.contains('open')||settingsScrim.classList.contains('open');

function flashCard(id){
  requestAnimationFrame(()=>{
    const node=document.querySelector('.card[data-id="'+id+'"],.row[data-id="'+id+'"]');
    if(node){node.classList.add('flash');node.scrollIntoView({block:'nearest',behavior:'smooth'});
      setTimeout(()=>node.classList.remove('flash'),1100);}
  });
}

function celebrate(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const colors=['#444FEF','#FF7D20','#1F9D6B','#E5484D','#7A5BF0'];
  const layer=el('div');layer.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden';
  document.body.appendChild(layer);
  const cx=window.innerWidth/2,cy=window.innerHeight*0.42;
  for(let i=0;i<26;i++){
    const p=el('div');const c=colors[i%colors.length];const sz=6+Math.random()*6;
    p.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;width:'+sz+'px;height:'+sz*0.6+'px;background:'+c+';border-radius:2px;opacity:1';
    layer.appendChild(p);
    const ang=Math.random()*Math.PI*2,dist=120+Math.random()*220;
    const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-60;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:'translate('+dx+'px,'+(dy+260)+'px) rotate('+((Math.random()*720-360)|0)+'deg)',opacity:0}
    ],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.6,.3,1)'});
  }
  setTimeout(()=>layer.remove(),1500);
}

/* ---- Command Palette ---- */
const cmdScrim=document.getElementById('cmdScrim');
const cmdInput=document.getElementById('cmdInput');
const cmdResultsEl=document.getElementById('cmdResults');
let cmdIdx=0,cmdItems=[];

const CMD_ACTIONS=[
  {name:'Создать задачу',icon:'✚',section:'Действия',run(){openTask(null)}},
  {name:'Доска',icon:'▦',section:'Навигация',run(){view='board';render()}},
  {name:'Список',icon:'☰',section:'Навигация',run(){view='list';render()}},
  {name:'Спринты',icon:'⟳',section:'Навигация',run(){view='sprints';render()}},
  {name:'Календарь',icon:'📅',section:'Навигация',run(){view='calendar';render()}},
  {name:'Дашборд',icon:'◧',section:'Навигация',run(){view='dashboard';render()}},
  {name:'Переключить тему',icon:'◑',section:'Действия',run:toggleTheme},
  {name:'Только мои задачи',icon:'◉',section:'Фильтры',run(){document.getElementById('onlyMineBtn').click()}},
  {name:'Настройки команды',icon:'⚙',section:'Действия',run(){openSettings()}},
  {name:'Сменить пользователя',icon:'👤',section:'Действия',run(){openUser()}},
];

function isCmdOpen(){return cmdScrim.classList.contains('open')}
function openCmd(){
  cmdScrim.classList.add('open');cmdInput.value='';cmdIdx=0;renderCmd();
  setTimeout(()=>cmdInput.focus(),50);
}
function closeCmd(){cmdScrim.classList.remove('open');cmdInput.value='';}

function renderCmd(){
  const q=cmdInput.value.trim().toLowerCase();
  cmdItems=[];
  let html='';

  const actions=q?CMD_ACTIONS.filter(a=>a.name.toLowerCase().includes(q)):CMD_ACTIONS;
  const grouped={};
  actions.forEach(a=>{(grouped[a.section]=grouped[a.section]||[]).push(a);});
  for(const [sec,items] of Object.entries(grouped)){
    html+='<div class="cmd-section">'+sec+'</div>';
    items.forEach(a=>{
      const i=cmdItems.length;cmdItems.push({type:'action',data:a});
      html+='<div class="cmd-item'+(i===cmdIdx?' active':'')+'" data-cmd="'+i+'"><span class="cmd-icon">'+a.icon+'</span><span class="cmd-name">'+esc(a.name)+'</span>'+(a.hotkey?'<kbd class="cmd-key">'+a.hotkey+'</kbd>':'')+'</div>';
    });
  }

  const tasks=q?state.tasks.filter(t=>t.title.toLowerCase().includes(q)||t.key.toLowerCase().includes(q)).slice(0,8):[];
  if(tasks.length){
    html+='<div class="cmd-section">Задачи</div>';
    tasks.forEach(t=>{
      const i=cmdItems.length;const st=statusOf(t.status);
      cmdItems.push({type:'task',data:t});
      html+='<div class="cmd-item'+(i===cmdIdx?' active':'')+'" data-cmd="'+i+'"><span class="cmd-icon" style="background:'+st.color+'1a"><span class="dot" style="background:'+st.color+'"></span></span><span class="cmd-name">'+esc(t.title)+'</span><span class="cmd-sub mono">'+t.key+'</span></div>';
    });
  }

  if(!cmdItems.length)html='<div class="cmd-empty">Ничего не найдено</div>';
  cmdResultsEl.innerHTML=html;
  cmdResultsEl.querySelectorAll('[data-cmd]').forEach(el=>{
    el.onclick=()=>{cmdIdx=+el.dataset.cmd;cmdExec();};
    el.onmouseenter=()=>{cmdIdx=+el.dataset.cmd;updateCmdActive();};
  });
}
function updateCmdActive(){
  cmdResultsEl.querySelectorAll('.cmd-item').forEach((el,i)=>el.classList.toggle('active',i===cmdIdx));
  const a=cmdResultsEl.querySelector('.cmd-item.active');
  if(a)a.scrollIntoView({block:'nearest'});
}
function cmdNav(dir){
  if(!cmdItems.length)return;
  cmdIdx=(cmdIdx+dir+cmdItems.length)%cmdItems.length;
  updateCmdActive();
}
function cmdExec(){
  if(!cmdItems.length)return;
  const item=cmdItems[cmdIdx];closeCmd();
  if(item.type==='action')item.data.run();
  else if(item.type==='task')openTask(item.data.id);
}
cmdInput.oninput=()=>{cmdIdx=0;renderCmd();};
cmdScrim.onclick=e=>{if(e.target===cmdScrim)closeCmd();};

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();isCmdOpen()?closeCmd():openCmd();return;}
  if(isCmdOpen()){
    if(e.key==='Escape'){e.preventDefault();closeCmd();return;}
    if(e.key==='ArrowDown'){e.preventDefault();cmdNav(1);return;}
    if(e.key==='ArrowUp'){e.preventDefault();cmdNav(-1);return;}
    if(e.key==='Enter'){e.preventDefault();cmdExec();return;}
    return;
  }
  if(e.key==='Escape'){closeScrim(taskScrim);closeScrim(userScrim);closeScrim(sprintScrim);closeScrim(settingsScrim);return;}
});

boot();
</script>
